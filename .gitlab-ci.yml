pages:
  stage: deploy
  cache:
    key: quartz-node-cache
    paths:
      - .cache/
  script:
    - |
      NODE_VERSION="v22.14.0"
      NODE_DIST="node-${NODE_VERSION}-linux-x64"
      mkdir -p "$CI_PROJECT_DIR/.cache"
      if [ ! -x "$CI_PROJECT_DIR/.cache/$NODE_DIST/bin/node" ]; then
        echo "Downloading portable Node.js ${NODE_VERSION}..."
        if command -v curl >/dev/null 2>&1; then
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/${NODE_DIST}.tar.gz" -o "$CI_PROJECT_DIR/.cache/node.tar.gz"
        else
          wget -qO "$CI_PROJECT_DIR/.cache/node.tar.gz" "https://nodejs.org/dist/${NODE_VERSION}/${NODE_DIST}.tar.gz"
        fi
        tar -xzf "$CI_PROJECT_DIR/.cache/node.tar.gz" -C "$CI_PROJECT_DIR/.cache"
        rm -f "$CI_PROJECT_DIR/.cache/node.tar.gz"
      fi
      export PATH="$CI_PROJECT_DIR/.cache/$NODE_DIST/bin:$PATH"
      node -v
      npm -v
    - QUARTZ_DIR="$CI_PROJECT_DIR/.quartz_build"
    - rm -rf "$QUARTZ_DIR"
    - git clone --depth 1 --branch v4 https://github.com/jackyzha0/quartz.git "$QUARTZ_DIR"
    - cd "$QUARTZ_DIR" && npm ci --cache "$CI_PROJECT_DIR/.cache/npm"
    - rm -rf "$QUARTZ_DIR/content/"*
    - |
      tar -C "$CI_PROJECT_DIR" \
        --exclude='./.git' \
        --exclude='./.gitignore' \
        --exclude='./.gitlab-ci.yml' \
        --exclude='./.cache' \
        --exclude='./.quartz_build' \
        --exclude='./publish.sh' \
        --exclude='./public' \
        --exclude='./documentation.md' \
        --exclude='./Documentation.md' \
        --exclude='./DOCUMENTATION.md' \
        -cf - . | tar -C "$QUARTZ_DIR/content" -xf -
    - |
      if [ ! -f "$QUARTZ_DIR/content/index.md" ]; then
        echo "---" > "$QUARTZ_DIR/content/index.md"
        echo "title: Data Races Notes" >> "$QUARTZ_DIR/content/index.md"
        echo "---" >> "$QUARTZ_DIR/content/index.md"
        echo "" >> "$QUARTZ_DIR/content/index.md"
        echo "# Data Races Notes" >> "$QUARTZ_DIR/content/index.md"
        echo "" >> "$QUARTZ_DIR/content/index.md"
        find "$QUARTZ_DIR/content" -maxdepth 2 -name "*.md" ! -name "index.md" | sort | while read -r file; do
          rel="${file#$QUARTZ_DIR/content/}"
          note="${rel%.md}"
          echo "- [[${note}]]" >> "$QUARTZ_DIR/content/index.md"
        done
      fi
    - |
      BASE_URL="${CI_PAGES_URL#https://}"
      BASE_URL="${BASE_URL#http://}"
      sed -i 's/pageTitle: ".*"/pageTitle: "Data Races Notes"/' "$QUARTZ_DIR/quartz.config.ts"
      if [ -n "$BASE_URL" ]; then
        sed -i "s|baseUrl: \".*\"|baseUrl: \"$BASE_URL\"|" "$QUARTZ_DIR/quartz.config.ts"
      fi
    - cd "$QUARTZ_DIR" && npx quartz build -o "$CI_PROJECT_DIR/public"
    - rm -rf "$QUARTZ_DIR"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
